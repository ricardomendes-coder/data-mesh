<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00002D">
  <title>{{ title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ══════════════════════════════════════════════════════════════════
       V360 design tokens.

       Values come from the main Rails app, not invented here:
         - orange / navy / status colors  -> app/assets/stylesheets/client_theme.scss
         - gray + accent ramps           -> the --*-100..900 custom props it compiles to
         - purple                        -> the "360" wordmark in icon-logo.png
         - Inter + a system mono stack   -> what vportal's stylesheets actually use
       ══════════════════════════════════════════════════════════════════ */
    :root{
      /* brand */
      --orange:#FF5A00;        /* primary-500 */
      --orange-hover:#E65100;  /* primary-550 — the app's hover step */
      --orange-600:#CC4800;
      --orange-100:#FFDECC;
      --orange-50:#FFF2EA;
      --purple:#7936BE;        /* the "360" in the logo */
      --purple-soft:#F3EBFC;
      --navy:#00002D;          /* secondary-500 */
      --navy-400:#000060;
      --logo-orange:#FF5C13;   /* fixed: the check mark never recolors */

      /* neutrals — the gray-100..900 ramp */
      --g-100:#D8DBDD; --g-200:#BCC1C6; --g-300:#A1A8AE; --g-400:#868E96;
      --g-500:#6C757D; --g-600:#545B62; --g-700:#3D4246; --g-800:#25282B;

      /* semantic text + surfaces */
      --title:var(--g-800);
      --body:var(--g-600);
      --muted:var(--g-400);
      --line:var(--g-500);
      --page:#F7F8F9;
      --surface:#fff;
      --border:#E6E8EA;
      --border-strong:var(--g-200);

      /* status */
      --ok:#28A745; --warn:#FFC107; --danger:#DC3545; --info:#17A2B8;

      /* radii — the app's 8px-dominant scale */
      --r-sm:4px; --r:8px; --r-lg:12px; --r-pill:999px;

      /* elevation — deliberately flat, matching the product */
      --sh-1:0 1px 2px rgba(0,0,45,.04);
      --sh-2:0 2px 4px rgba(0,0,45,.05);
      --sh-3:0 8px 24px rgba(0,0,45,.08);
      --ring:0 0 0 3px rgba(255,90,0,.25);

      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    /* The `hidden` attribute is only a UA `display:none`, so ANY author rule
       that sets display beats it — .bi-kind, .bi-pager and .bi-tile-sql all do.
       That made "hidden" elements render anyway (every tile claiming to be
       unfiltered, the pager showing on a single page). Author-level !important
       is the standard fix and keeps `hidden` meaning what it says. */
    [hidden]{display:none !important;}
    html,body{height:100%;font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--title);background:var(--page);font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
    code{font-family:var(--mono);font-size:.86em;background:var(--purple-soft);padding:.08rem .34rem;border-radius:var(--r-sm);color:var(--purple);}
    a{color:var(--orange);text-decoration:none;}
    a:hover{color:var(--orange-hover);}
    :focus-visible{outline:none;box-shadow:var(--ring);}
    ::selection{background:var(--orange-100);color:var(--navy);}
    .v360-logo,.v360-mark{display:block;flex-shrink:0;}

    /* ── shell ── */
    /* dvh, not vh: with vh the navy rail stops short of the bottom whenever the
       visual viewport differs from the layout viewport (mobile browser chrome). */
    .bi-shell{display:flex;height:100dvh;overflow:hidden;}
    .bi-side{width:68px;flex-shrink:0;transition:width .2s cubic-bezier(.4,0,.2,1);overflow:hidden;}
    .bi-side:hover{width:232px;}
    .bi-side-inner{width:100%;height:100%;background:var(--navy);color:#fff;display:flex;flex-direction:column;overflow:hidden;}

    /* brand lockup: mark alone when collapsed, full logo when expanded */
    .bi-brand{display:flex;align-items:center;gap:.7rem;height:66px;padding:0 1.1rem;border-bottom:1px solid rgba(255,255,255,.09);white-space:nowrap;flex-shrink:0;}
    .bi-brand-mark{flex-shrink:0;display:flex;align-items:center;}
    .bi-brand-tx{line-height:1.15;opacity:0;transition:opacity .16s;}
    .bi-side:hover .bi-brand-tx{opacity:1;}
    .bi-brand-tx b{font-size:.9rem;font-weight:700;letter-spacing:-.01em;display:block;}
    .bi-brand-tx span{font-size:.63rem;color:rgba(255,255,255,.5);font-weight:600;letter-spacing:.09em;text-transform:uppercase;}

    .bi-side-nav{padding:.8rem .7rem;display:flex;flex-direction:column;gap:3px;flex:1;}
    .bi-nav-item{position:relative;display:flex;align-items:center;gap:.75rem;padding:.62rem .6rem;border-radius:var(--r);color:rgba(255,255,255,.68);font-size:.86rem;font-weight:500;cursor:pointer;transition:background .13s,color .13s;white-space:nowrap;border:none;background:transparent;font-family:inherit;text-align:left;width:100%;}
    .bi-side:not(:hover) .bi-nav-item{justify-content:center;}
    .bi-nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
    .bi-nav-item.active{background:var(--orange);color:#fff;font-weight:600;}
    /* Collapsed rail: a 40px solid-orange block reads far too loud, so switch to
       a tinted chip with an edge accent and keep the solid fill for expanded. */
    .bi-side:not(:hover) .bi-nav-item.active{background:rgba(255,90,0,.15);color:var(--orange);}
    .bi-side:not(:hover) .bi-nav-item.active::before{content:"";position:absolute;left:-.7rem;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 var(--r-sm) var(--r-sm) 0;background:var(--orange);}
    .bi-nav-item svg{flex-shrink:0;opacity:.95;width:19px;height:19px;}
    .bi-nav-item span{opacity:0;transition:opacity .16s;}
    .bi-side:not(:hover) .bi-nav-item span{display:none;}
    .bi-side:hover .bi-nav-item span{opacity:1;}

    .bi-conn-pill{margin:.7rem;padding:.6rem;border-radius:var(--r);background:rgba(255,255,255,.06);font-size:.72rem;color:rgba(255,255,255,.72);display:flex;align-items:center;gap:.55rem;line-height:1.3;white-space:nowrap;overflow:hidden;}
    .bi-conn-dot{width:8px;height:8px;border-radius:var(--r-pill);flex-shrink:0;background:var(--g-500);margin:0 auto;}
    .bi-side:hover .bi-conn-dot{margin:0;}
    .bi-conn-tx{opacity:0;transition:opacity .16s;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:.68rem;}
    .bi-side:hover .bi-conn-tx{opacity:1;}
    .bi-conn-dot.on{background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.18);}
    .bi-conn-dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(255,193,7,.18);}

    .bi-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--page);}
    .bi-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;}

    /* ── topbar ── */
    .bi-topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0 clamp(18px,3vw,34px);min-height:66px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
    .bi-topbar-tt{padding:.9rem 0;}
    .bi-topbar-title{font-size:1.1rem;font-weight:700;color:var(--title);letter-spacing:-.015em;}
    .bi-topbar-sub{font-size:.78rem;color:var(--muted);margin-top:.1rem;}
    .bi-topbar-actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.9rem 0;}
    /* initials chip — gives the signed-in user a face */
    .bi-avatar{width:31px;height:31px;border-radius:var(--r-pill);background:var(--purple-soft);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;letter-spacing:.02em;flex-shrink:0;text-transform:uppercase;}

    /* ── buttons ── */
    .bi-btn{display:inline-flex;align-items:center;justify-content:center;gap:.42rem;height:36px;padding:0 15px;border:1px solid transparent;border-radius:var(--r);background:var(--orange);color:#fff;font-family:inherit;font-size:.84rem;font-weight:600;cursor:pointer;transition:background .13s,border-color .13s,color .13s,box-shadow .13s;white-space:nowrap;text-decoration:none;}
    .bi-btn:hover{background:var(--orange-hover);color:#fff;}
    .bi-btn:active{background:var(--orange-600);}
    .bi-btn.ghost{background:var(--surface);border-color:var(--border-strong);color:var(--body);}
    .bi-btn.ghost:hover{border-color:var(--g-300);background:#FCFCFD;color:var(--title);}
    .bi-btn.sm{height:30px;padding:0 11px;font-size:.78rem;}
    .bi-btn svg{flex-shrink:0;}

    .bi-page{padding:clamp(18px,3vw,30px);}

    /* ── tabs (Query / Reports) ── */
    .bi-panel-tabs{display:flex;align-items:center;gap:.15rem;flex-wrap:wrap;margin-bottom:1.4rem;border-bottom:1px solid var(--border);}
    .bi-ptab{display:inline-flex;align-items:center;gap:.45rem;height:41px;padding:0 .95rem;border:none;background:transparent;border-bottom:2px solid transparent;font-family:inherit;font-size:.88rem;font-weight:600;color:var(--body);cursor:pointer;margin-bottom:-1px;transition:color .13s,border-color .13s;}
    .bi-ptab:hover{color:var(--title);}
    .bi-ptab.active{color:var(--orange);border-bottom-color:var(--orange);}
    .bi-ptab svg{flex-shrink:0;opacity:.9;}

    .pane{display:none;}
    .pane.active{display:block;}

    /* ── form fields ── */
    .bi-fld{margin-bottom:1rem;max-width:420px;}
    .bi-fld label{display:block;font-size:.73rem;font-weight:600;color:var(--body);margin-bottom:.35rem;letter-spacing:.01em;}
    .bi-fld select,.bi-fld input{width:100%;height:38px;border:1px solid var(--border-strong);border-radius:var(--r);padding:0 .7rem;font-family:inherit;font-size:.85rem;color:var(--title);background:var(--surface);outline:none;transition:border-color .13s,box-shadow .13s;}
    .bi-fld select:focus,.bi-fld input:focus{border-color:var(--orange);box-shadow:var(--ring);}

    /* ── SQL editor ── */
    .bi-editor{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);margin-bottom:1.3rem;box-shadow:var(--sh-1);}
    .bi-editor:focus-within{border-color:var(--border-strong);box-shadow:var(--sh-2);}
    .bi-editor-bar{display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem .5rem .85rem;background:#FAFBFB;border-bottom:1px solid var(--border);flex-wrap:wrap;}
    .bi-editor-dot{width:7px;height:7px;border-radius:var(--r-pill);background:var(--g-200);}
    .bi-editor-tag{font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--muted);}
    .bi-editor-hint{font-size:.7rem;color:var(--g-300);margin-left:.3rem;}
    @media(max-width:1050px){.bi-editor-hint{display:none;}}
    .bi-editor-bar .bi-btn:first-of-type{margin-left:auto;}
    .bi-ta{display:block;width:100%;min-height:196px;resize:vertical;border:0;outline:none;padding:.95rem 1rem;font-family:var(--mono);font-size:.84rem;line-height:1.65;color:var(--g-800);background:var(--surface);tab-size:2;white-space:pre;overflow:auto;}
    .bi-ta::placeholder{color:var(--g-300);}
    /* The editor shell already signals focus via :focus-within. Leaving the
       global ring on would clip it against overflow:hidden into a hard line. */
    .bi-ta:focus-visible{box-shadow:none;}

    /* ── result table ── */
    .bi-result-meta{font-size:.75rem;color:var(--muted);margin-bottom:.6rem;font-variant-numeric:tabular-nums;}
    .bi-restbl-wrap{border:1px solid var(--border);border-radius:var(--r-lg);overflow:auto;background:var(--surface);max-width:100%;box-shadow:var(--sh-1);}
    .bi-restbl{border-collapse:separate;border-spacing:0;width:100%;font-size:.8rem;}
    .bi-restbl th{position:sticky;top:0;background:#F7F8F9;text-align:left;font-weight:600;color:var(--body);padding:.55rem .75rem;border-bottom:1px solid var(--border-strong);white-space:nowrap;font-family:var(--mono);font-size:.71rem;letter-spacing:.02em;z-index:1;}
    .bi-restbl td{padding:.48rem .75rem;border-bottom:1px solid #F1F2F4;color:var(--g-700);white-space:nowrap;font-variant-numeric:tabular-nums;}
    .bi-restbl tbody tr:hover td{background:var(--orange-50);}
    .bi-restbl tbody tr:last-child td{border-bottom:none;}
    .bi-null{color:var(--g-300);font-style:italic;font-size:.74rem;}

    /* ── alerts ── */
    .bi-err,.bi-ok{display:flex;align-items:flex-start;gap:.55rem;border-radius:var(--r);padding:.72rem .9rem;font-size:.82rem;line-height:1.5;margin-bottom:1.1rem;border:1px solid;}
    .bi-err{background:#FFF6F0;border-color:#FBD9C2;color:#9A3412;}
    .bi-err svg{flex-shrink:0;margin-top:1px;color:#EA580C;}
    .bi-ok{background:#EAF7EE;border-color:#BFE6CA;color:#0F5132;}

    /* ── cards (reports) ── */
    .bi-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:.9rem;}
    .bi-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.15rem;transition:border-color .15s,box-shadow .15s,transform .15s;display:flex;flex-direction:column;box-shadow:var(--sh-1);}
    .bi-card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--sh-3);}
    /* purple accent: the second brand color, used to distinguish reports from
       the orange primary actions */
    .bi-card-ic{width:38px;height:38px;border-radius:var(--r);background:var(--purple-soft);color:var(--purple);display:flex;align-items:center;justify-content:center;margin-bottom:.8rem;}
    .bi-card-nm{font-size:.98rem;font-weight:700;color:var(--title);margin-bottom:.28rem;line-height:1.3;letter-spacing:-.01em;}
    .bi-card-sub{font-size:.79rem;color:var(--muted);line-height:1.5;margin-bottom:.9rem;}
    .bi-card-meta{display:flex;align-items:center;gap:.45rem;padding-top:.85rem;border-top:1px solid var(--border);margin-top:auto;}
    .bi-empty-lg{padding:3.2rem 1rem;text-align:center;color:var(--muted);font-size:.88rem;border:1px dashed var(--border-strong);border-radius:var(--r-lg);background:var(--surface);}

    /* ── datasets ── */
    .bi-toolbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1.5rem;}
    /* Listing search row: the bar sits where the old name field was. */
    .bi-listtools{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem;}
    .bi-listtools .bi-search{flex:1;max-width:none;}
    .bi-search-empty{color:var(--muted);font-size:.85rem;padding:.4rem 0 1rem;}
    /* Inline title rename in the dashboard editor — looks like the title until
       you focus it, so it doesn't shout "form" at the top of the page. */
    .bi-titleedit{margin:0;}
    .bi-titleedit input{font-size:1.1rem;font-weight:700;color:var(--title);letter-spacing:-.015em;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;padding:.1rem .35rem;margin:-.1rem -.35rem;font-family:inherit;width:min(28rem,60vw);}
    .bi-titleedit input:hover{border-color:var(--border);}
    .bi-titleedit input:focus{border-color:var(--orange);box-shadow:var(--ring);background:var(--surface);outline:none;}
    .bi-search{position:relative;flex:1;min-width:220px;max-width:420px;}
    .bi-search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--g-300);pointer-events:none;}
    .bi-search input{width:100%;height:38px;border:1px solid var(--border-strong);border-radius:var(--r);padding:0 .7rem 0 2.1rem;font-family:inherit;font-size:.85rem;color:var(--title);background:var(--surface);outline:none;transition:border-color .13s,box-shadow .13s;}
    .bi-search input:focus{border-color:var(--orange);box-shadow:var(--ring);}
    .bi-chips{display:flex;gap:.3rem;flex-wrap:wrap;margin-left:auto;}
    .bi-chip{display:inline-flex;align-items:center;height:30px;padding:0 .7rem;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--surface);color:var(--body);font-size:.78rem;font-weight:600;transition:all .13s;}
    .bi-chip:hover{border-color:var(--g-300);color:var(--title);}
    .bi-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}

    .bi-group{margin-bottom:2rem;}
    .bi-group-hd{display:flex;align-items:center;gap:.6rem;margin-bottom:.2rem;}
    .bi-group-tt{font-size:.94rem;font-weight:700;color:var(--title);letter-spacing:-.01em;}
    .bi-group-ct{font-size:.7rem;font-weight:700;color:var(--muted);background:var(--page);border:1px solid var(--border);padding:.1rem .45rem;border-radius:var(--r-pill);}
    .bi-group-sub{font-size:.8rem;color:var(--muted);margin-bottom:.5rem;line-height:1.5;}

    /* One row per dataset: a table would wrap badly at 267 items, and rows keep
       the name column aligned for scanning. */
    .bi-dslist{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--sh-1);margin-top:.6rem;}
    /* Fixed track widths, not `auto`: each row is its own grid, so auto-sized
       columns land at a different x on every row and nothing lines up. */
    .bi-dsrow{display:grid;grid-template-columns:74px 296px 1fr 74px 124px 14px;align-items:center;gap:.85rem;padding:.62rem .9rem;border-bottom:1px solid #F1F2F4;color:var(--title);transition:background .1s;}
    .bi-dsrow:last-child{border-bottom:none;}
    .bi-dsrow:hover{background:var(--orange-50);color:var(--title);}
    .bi-dsname{font-family:var(--mono);font-size:.81rem;font-weight:600;color:var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .bi-dsdesc{font-size:.79rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .bi-undoc{color:var(--g-300);font-style:italic;}
    .bi-dsmeta{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;}
    .bi-dsarrow{color:var(--g-300);}
    .bi-dsrow:hover .bi-dsarrow{color:var(--orange);}
    @media(max-width:860px){
      .bi-dsrow{grid-template-columns:70px 1fr auto;}
      .bi-dsdesc,.bi-dsarrow{display:none;}
    }

    /* kind badges — table / view / matview read very differently, so colour them */
    .bi-kind{display:inline-flex;align-items:center;justify-content:center;height:20px;padding:0 .5rem;border-radius:var(--r-sm);font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-family:var(--mono);}
    .bi-kind-table{background:var(--orange-50);color:var(--orange-600);}
    .bi-kind-view{background:var(--purple-soft);color:var(--purple);}
    .bi-kind-matview{background:#E7F2F5;color:#0F6674;}

    /* dataset detail */
    .bi-ds-head{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:1.1rem;}
    .bi-ds-stat{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;}
    .bi-ds-head .bi-btn{margin-left:auto;}
    .bi-ds-desc{font-size:.87rem;color:var(--body);line-height:1.65;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--purple);border-radius:var(--r);padding:.9rem 1.05rem;margin-bottom:1.5rem;white-space:pre-wrap;box-shadow:var(--sh-1);}
    /* Dashboard description as a discreet ⓘ by the subtitle — hover shows it. */
    .bi-ds-info{display:inline-flex;vertical-align:middle;margin-left:.15rem;color:var(--muted);cursor:help;}
    .bi-ds-info:hover,.bi-ds-info:focus{color:var(--orange);outline:none;}
    .bi-ds-desc-empty{border-left-color:var(--border-strong);color:var(--muted);white-space:normal;}
    .bi-snippet{font-family:var(--mono);font-size:.78rem;line-height:1.6;background:#FAFBFB;border:1px solid var(--border);border-radius:var(--r);padding:.75rem .9rem;margin-top:.6rem;overflow-x:auto;color:var(--g-800);white-space:pre;}
    .bi-catalog td{white-space:normal;}
    .bi-colnum{color:var(--g-300);font-family:var(--mono);font-size:.72rem;width:1%;}
    .bi-badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 .28rem;border-radius:var(--r-pill);background:var(--orange-100);color:var(--orange-600);font-size:.64rem;font-weight:700;margin-left:.1rem;}
    .bi-example{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:.95rem 1.05rem;margin-bottom:.85rem;box-shadow:var(--sh-1);}
    .bi-example-hd{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
    .bi-example-tt{font-size:.88rem;font-weight:700;color:var(--title);}
    .bi-example-hd .bi-btn{margin-left:auto;}
    .bi-example .bi-snippet{margin-top:.7rem;}

    /* ── charts ── */
    .bi-card-ic-chart{background:var(--orange-50);color:var(--orange-600);}
    .bi-chartbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.1rem 1.15rem;box-shadow:var(--sh-1);position:relative;height:340px;}
    .bi-chartbox-lg{height:400px;margin-bottom:1.4rem;}
    .bi-chart-grid{display:grid;grid-template-columns:268px 1fr;gap:1.3rem;align-items:start;margin-top:1.5rem;}
    @media(max-width:900px){.bi-chart-grid{grid-template-columns:1fr;}}
    .bi-chart-cfg{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.05rem 1.1rem;box-shadow:var(--sh-1);}
    .bi-chart-cfg .bi-fld{max-width:none;}
    .bi-chart-cfg .bi-group-tt{margin-bottom:.9rem;}
    .bi-checks{display:flex;flex-direction:column;gap:.15rem;max-height:210px;overflow-y:auto;}
    .bi-check{display:flex;align-items:center;gap:.5rem;padding:.32rem .4rem;border-radius:var(--r-sm);font-size:.82rem;color:var(--body);cursor:pointer;}
    .bi-check:hover{background:var(--page);color:var(--title);}
    .bi-check input{width:14px;height:14px;accent-color:var(--orange);flex-shrink:0;}
    /* Capped measure: these run the full content width otherwise, and a 1300px
       line of 12px text is a paragraph nobody reads. */
    .bi-hint{font-size:.74rem;color:var(--muted);line-height:1.5;margin-top:.5rem;max-width:78ch;}
    .bi-chart-main .bi-fld{max-width:none;}
    #chart-warnings:not(:empty){margin-top:1rem;}
    #chart-warnings .bi-err{margin-bottom:.6rem;}

    /* ── dashboards ── */
    .bi-card-ic-dash{background:#E7F2F5;color:#0F6674;}
    .bi-search-plain input{padding-left:.7rem;}
    .bi-fld-inline{margin-bottom:0;display:flex;align-items:center;gap:.55rem;max-width:none;}
    .bi-fld-inline label{margin-bottom:0;white-space:nowrap;}
    .bi-fld-inline select{width:auto;min-width:190px;}
    .bi-fld-narrow select{min-width:104px;}

    /* 6 columns so third (2), half (3) and full (6) all divide evenly */
    .bi-tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:1rem;align-items:start;}
    .bi-tile{grid-column:span 3;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);display:flex;flex-direction:column;min-width:0;}
    .bi-tile-full{grid-column:span 6;}
    .bi-tile-half{grid-column:span 3;}
    .bi-tile-third{grid-column:span 2;}
    @media(max-width:1100px){
      .bi-tile-third{grid-column:span 3;}
    }
    @media(max-width:780px){
      .bi-tile,.bi-tile-full,.bi-tile-half,.bi-tile-third{grid-column:span 6;}
    }
    .bi-tile-hd{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;border-bottom:1px solid var(--border);min-height:44px;}
    .bi-tile-tt{font-size:.87rem;font-weight:700;color:var(--title);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .bi-tile-tt:hover{color:var(--orange);}
    .bi-tile-hd .bi-kind{margin-left:auto;}
    .bi-tile-ctl{margin-left:auto;display:flex;align-items:center;gap:.25rem;}
    .bi-tile-ctl form{display:flex;}
    .bi-tile-ctl select{height:26px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--body);font-family:inherit;font-size:.72rem;padding:0 .3rem;outline:none;}
    .bi-tile-canvas{padding:.85rem .9rem;height:248px;position:relative;}
    .bi-tile-full .bi-tile-canvas{height:320px;}
    .bi-tile-err{display:flex;align-items:center;gap:.5rem;padding:1.4rem .9rem;font-size:.8rem;color:#9A3412;}
    .bi-tile-err svg{flex-shrink:0;color:#EA580C;}
    .bi-tile-warn{padding:0 .9rem .7rem;font-size:.72rem;color:var(--muted);line-height:1.45;}

    .bi-icobtn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--body);cursor:pointer;transition:all .12s;}
    .bi-icobtn:hover{border-color:var(--g-300);color:var(--title);background:#FCFCFD;}
    .bi-icobtn.danger:hover{border-color:#FBD9C2;color:var(--danger);background:#FFF6F0;}
    .bi-icobtn[disabled]{opacity:.35;cursor:default;}
    .bi-icobtn[disabled]:hover{border-color:var(--border-strong);color:var(--body);background:var(--surface);}

    /* ── listing: view switcher, tags, previews ── */
    .bi-viewsw{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden;}
    .bi-viewbtn{display:inline-flex;align-items:center;gap:.3rem;padding:.34rem .55rem;font-size:.72rem;font-weight:600;color:var(--muted);background:var(--surface);border:none;text-decoration:none;transition:background .12s,color .12s;}
    .bi-viewbtn + .bi-viewbtn{border-left:1px solid var(--border-strong);}
    .bi-viewbtn:hover{background:var(--orange-50);color:var(--title);}
    .bi-viewbtn.active{background:var(--orange);color:#fff;}
    .bi-viewbtn.active:hover{color:#fff;}
    @media(max-width:820px){.bi-viewbtn span{display:none;}}

    .bi-tagbar{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.9rem;}
    .bi-tagchip{display:inline-flex;align-items:center;gap:.3rem;padding:.24rem .55rem;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--surface);color:var(--body);font-size:.74rem;text-decoration:none;}
    .bi-tagchip:hover{border-color:var(--orange);color:var(--orange);}
    .bi-tagchip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
    .bi-tagn{font-family:var(--mono);font-size:.64rem;opacity:.65;}

    .bi-tags{display:flex;flex-wrap:wrap;align-items:center;gap:.28rem;margin:.15rem 0;}
    .bi-tag{display:inline-block;padding:.14rem .45rem;border-radius:var(--r-pill);background:var(--purple-soft);color:var(--purple);font-size:.68rem;font-weight:600;}
    .bi-tagedit{position:relative;}
    .bi-tagedit>summary{list-style:none;cursor:pointer;width:18px;height:18px;line-height:16px;text-align:center;border:1px dashed var(--border-strong);border-radius:var(--r-pill);color:var(--muted);font-size:.72rem;}
    .bi-tagedit>summary::-webkit-details-marker{display:none;}
    .bi-tagedit>summary:hover{border-color:var(--orange);color:var(--orange);}
    .bi-tagform{position:absolute;z-index:30;top:22px;left:0;display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;padding:.4rem;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-3);}
    /* The raw field, which is what you get with the script gone. Once
       tag-editor.js runs this goes type=hidden and .bi-tagbox takes over. */
    .bi-tagform>input[name="tags"]{width:210px;height:28px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 .4rem;font-size:.76rem;outline:none;}
    .bi-tagform>input[name="tags"]:focus{border-color:var(--orange);box-shadow:var(--ring);}
    /* The picker: every tag an admin has defined, checked or not. */
    .bi-tagmenu{display:flex;flex-direction:column;gap:.12rem;width:210px;max-height:220px;overflow-y:auto;}
    .bi-tagpick{justify-content:flex-start;gap:.35rem;font-size:.76rem;}
    .bi-tagmenu-empty{margin:0;padding:.3rem .1rem;color:var(--muted);font-size:.72rem;line-height:1.35;}

    /* preview cards are taller: they hold a real chart */
    .bi-cards-preview .bi-card{min-height:290px;}
    .bi-card-prev{height:150px;margin:.4rem 0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;}
    .bi-card-prev>*{flex:1;min-height:0;}
    .bi-card-prev .bi-kpi{font-size:1.9rem;}
    .bi-card-prev .bi-restbl{font-size:.68rem;}
    .bi-card-prev .bi-restbl th{padding:.25rem .4rem;font-size:.62rem;}
    .bi-card-prev .bi-restbl td{padding:.2rem .4rem;}
    .bi-prev-age{position:absolute;right:6px;bottom:4px;display:flex;align-items:center;gap:.25rem;font-size:.62rem;color:var(--muted);background:rgba(255,255,255,.88);padding:0 .3rem;border-radius:var(--r-sm);}
    #refresh-dashboard[aria-busy="true"]{opacity:.6;pointer-events:none;}
    #refresh-dashboard[aria-busy="true"] svg{animation:bi-spin 1s linear infinite;}
    @keyframes bi-spin{to{transform:rotate(360deg);}}
    .bi-prev-refresh{border:none;background:none;color:var(--muted);cursor:pointer;font-size:.78rem;line-height:1;padding:0;}
    .bi-prev-refresh:hover{color:var(--orange);}
    .bi-card-prev{position:relative;}
    .bi-prev-empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.74rem;}
    .bi-prev-nodata{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:.74rem;}


    .bi-listtbl td{vertical-align:middle;}
    .bi-listtbl a{font-weight:600;}
    .bi-listact{white-space:nowrap;display:flex;gap:.3rem;}

    /* ── language switcher ── */
    .bi-lang{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden;}
    .bi-langbtn{border:none;background:var(--surface);color:var(--muted);font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.04em;padding:.34rem .5rem;cursor:pointer;transition:background .12s,color .12s;}
    .bi-langbtn:hover{background:var(--orange-50);color:var(--title);}
    .bi-langbtn.active{background:var(--orange);color:#fff;}
    .bi-lang form + form .bi-langbtn{border-left:1px solid var(--border-strong);}

    /* ── dashboard grid ── */
    /* 12 columns, explicit rows. auto-rows rather than a fixed template so a
       tile dropped at row 40 doesn't force 39 empty rows to be painted. */
    /* Superset's grid, unit for unit: 8px rows, 16px between columns, and the
       gap between stacked tiles carried in the coordinates themselves (a tile
       ends two rows short of the next). A row-gap here would multiply — a tile
       50 rows tall would gain 49 gaps — so vertical spacing lives in the y. */
    .bi-tiles{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:8px;column-gap:16px;row-gap:0;align-items:stretch;}
    /* A chart that didn't import, holding its slot. Deliberately quiet: it is
       a note about the dashboard, not an error the reader caused. */
    .bi-tile-missing{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.8rem;background:none;border:1px dashed var(--border-strong);box-shadow:none;color:var(--muted);text-align:left;overflow:hidden;}
    .bi-tile-missing svg{flex-shrink:0;opacity:.7;}
    .bi-missing-nm{font-size:.82rem;font-weight:600;color:var(--body);}
    .bi-missing-why{font-size:.74rem;margin-top:.1rem;}
    .bi-tile-divider{grid-column:1/-1;align-self:center;height:1px;background:var(--border);border:0;box-shadow:none;}
    @media(max-width:900px){
      /* One column on a phone: a 12-col drag layout is meaningless there, and
         honouring grid-row would leave holes. */
      .bi-tiles{display:flex;flex-direction:column;}
      .bi-tiles .bi-tile{grid-column:auto !important;grid-row:auto !important;min-height:230px;}
    }
    .bi-tile{min-width:0;overflow:hidden;display:flex;flex-direction:column;}
    .bi-tile-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;}
    .bi-tile-body>*{flex:1;min-height:0;}
    .bi-tile-canvas{position:relative;min-height:0;}

    /* Skeleton while a tile fetches its own data. */
    .bi-tile-skel{display:flex;flex-direction:column;justify-content:flex-end;gap:.5rem;height:100%;padding:.6rem .2rem;}
    .bi-tile-skel span{display:block;border-radius:3px;background:linear-gradient(90deg,#F1F2F4 25%,#E7E9EC 37%,#F1F2F4 63%);background-size:400% 100%;animation:bi-shimmer 1.3s ease infinite;}
    .bi-tile-skel span:nth-child(1){height:38%;}
    .bi-tile-skel span:nth-child(2){height:62%;}
    .bi-tile-skel span:nth-child(3){height:48%;}
    @keyframes bi-shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
    @media(prefers-reduced-motion:reduce){.bi-tile-skel span{animation:none;}}

    /* Drag + resize, editor only. */
    .bi-tiles-editing .bi-tile{cursor:default;}
    .bi-drag{cursor:grab;color:var(--muted);font-size:.9rem;line-height:1;user-select:none;padding:0 .15rem;}
    .bi-drag:active{cursor:grabbing;}
    .bi-dragging{opacity:.75;outline:2px solid var(--orange);z-index:5;}
    .bi-resize{position:absolute;right:2px;bottom:2px;width:14px;height:14px;cursor:nwse-resize;
               background:linear-gradient(135deg,transparent 50%,var(--g-300) 50%,var(--g-300) 70%,transparent 70%);}
    .bi-tile{position:relative;}
    .bi-dirty{color:var(--danger);font-weight:600;}

    /* Per-tile menu: SQL, the chart's page, the builder. */
    .bi-tilemenu{position:relative;}
    .bi-tilemenu>summary{list-style:none;cursor:pointer;}
    .bi-tilemenu>summary::-webkit-details-marker{display:none;}
    .bi-tilemenu-pop{position:absolute;right:0;top:26px;z-index:20;min-width:210px;display:flex;flex-direction:column;gap:.1rem;
                     padding:.35rem;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-2,0 6px 20px rgba(16,24,40,.12));}
    .bi-tilemenu-pop a,.bi-tilemenu-pop button{text-align:left;font-size:.78rem;padding:.35rem .45rem;border:none;background:none;color:var(--body);cursor:pointer;border-radius:var(--r-sm);text-decoration:none;}
    .bi-tilemenu-pop a:hover,.bi-tilemenu-pop button:hover{background:var(--orange-50);color:var(--title);}
    .bi-tile-meta{border-top:1px solid var(--border);margin-top:.25rem;padding:.35rem .45rem;font-size:.7rem;color:var(--muted);}
    .bi-tile-meta p{margin:.25rem 0 0;}
    .bi-tile-sql{max-height:170px;overflow:auto;margin:.3rem 0;padding:.5rem .6rem;border-radius:var(--r);background:#F7F8F9;border:1px solid var(--border);font-family:var(--mono);font-size:.7rem;white-space:pre-wrap;}

    /* ── dashboard filter bar ── */
    .bi-filterbar{display:flex;align-items:flex-end;gap:.7rem;flex-wrap:wrap;padding:.7rem .85rem;margin-bottom:.9rem;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);}
    /* Filters as a drawer over the right edge. It overlays rather than pushes:
       tiles sit at Superset's own column widths, and narrowing the canvas to
       make room would distort every imported dashboard. */
    /* The bar above the tiles: the toggle, then a removable pill per applied
       filter, then Clear — the shape of the reference, on the right. */
    /* The filter bar sits in its own bordered box below the tabs, like the
       reference: the toggle, the active-filter pills, and Clear on the right. */
    .bi-filterbar-top{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.9rem;padding:.4rem .7rem;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);}
    .bi-filterdrawer{display:inline-flex;}
    .bi-filterdrawer>summary{list-style:none;cursor:pointer;}
    .bi-filterdrawer>summary::-webkit-details-marker{display:none;}
    /* Flat toggle now that it lives inside the box. */
    .bi-filtertoggle{display:inline-flex;align-items:center;gap:.4rem;padding:.15rem .4rem;border-radius:var(--r-sm);color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;transition:color .13s;}
    .bi-filtertoggle:hover,.bi-filterdrawer[open] .bi-filtertoggle{color:var(--orange);}
    .bi-filtercount{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 .28rem;border-radius:var(--r-pill);background:var(--orange);color:#fff;font-size:.64rem;font-weight:700;}
    .bi-activepills{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem;flex:1;}
    .bi-activepill{display:inline-flex;align-items:center;gap:.25rem;height:24px;padding:0 .2rem 0 .5rem;border-radius:var(--r-pill);background:var(--orange-50);border:1px solid var(--orange-100);font-size:.72rem;}
    .bi-activepill-lb{color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-size:.6rem;font-weight:700;}
    .bi-activepill-vl{color:var(--orange-600);font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .bi-activepill-x{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:var(--r-pill);color:var(--orange-600);opacity:.6;font-size:.9rem;line-height:1;}
    .bi-activepill-x:hover{opacity:1;background:var(--orange-100);}
    .bi-clearfilters{margin-left:auto;color:var(--muted);font-size:.74rem;font-weight:600;}
    .bi-clearfilters:hover{color:var(--danger);}
    /* Dim the page behind the open drawer, and give a click target to close. */
    .bi-drawer-scrim{position:fixed;inset:0;z-index:59;background:rgba(0,0,45,.18);}
    .bi-filterpanel{position:fixed;top:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:stretch;gap:1rem;width:340px;max-width:92vw;height:100vh;overflow-y:auto;padding:1.1rem 1.15rem;border-left:1px solid var(--border-strong);background:var(--surface);box-shadow:var(--sh-3);}
    .bi-drawer-hd{display:flex;align-items:center;justify-content:space-between;padding-bottom:.6rem;border-bottom:1px solid var(--border);}
    .bi-drawer-tt{font-size:1rem;font-weight:700;color:var(--title);letter-spacing:-.01em;}
    .bi-filterpanel .bi-filter{display:flex;flex-direction:column;gap:.3rem;}
    .bi-filterpanel .bi-filter>label{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
    .bi-filterpanel .bi-filter input[type=date],.bi-filterpanel .bi-filter>input{width:100%;height:34px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 .5rem;font-family:inherit;font-size:.82rem;color:var(--title);background:var(--surface);}
    .bi-filterpanel .bi-daterange{display:flex;gap:.3rem;}
    .bi-filter-actions{position:sticky;bottom:0;display:flex;gap:.5rem;margin-top:auto;padding:.7rem 0 .2rem;background:var(--surface);border-top:1px solid var(--border);}
    @media (max-width:720px){.bi-filterpanel{width:100%;max-width:100%;}}

    /* ── saved views ── */
    .bi-savedviews{padding-bottom:.9rem;border-bottom:1px solid var(--border);}
    .bi-savedviews-hd{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.5rem;}
    .bi-viewchips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.55rem;}
    .bi-viewchip{display:inline-flex;align-items:center;gap:.15rem;padding:.2rem .2rem .2rem .6rem;border-radius:var(--r-pill);background:var(--orange-50);border:1px solid var(--orange-100);}
    .bi-viewchip a{color:var(--orange-600);font-size:.76rem;font-weight:600;}
    .bi-viewchip-x{border:0;background:none;cursor:pointer;color:var(--orange-600);opacity:.6;font-size:1rem;line-height:1;padding:0 .25rem;}
    .bi-viewchip-x:hover{opacity:1;}
    .bi-saveview>summary{list-style:none;cursor:pointer;}
    .bi-saveview>summary::-webkit-details-marker{display:none;}
    .bi-saveview-row{display:flex;gap:.4rem;margin-top:.5rem;}
    .bi-saveview-row input{flex:1;min-width:0;height:32px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 .5rem;font-family:inherit;font-size:.82rem;}

    /* ── searchable multi-select (replaces the native size=1 multi-select) ── */
    .bi-ms{position:relative;}
    /* The closed control reads as a proper dropdown: soft rounded field, a
       chevron on the right, chips for what's chosen. */
    .bi-ms-control{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem;min-height:38px;padding:.32rem .5rem;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);cursor:text;transition:border-color .13s,box-shadow .13s;}
    .bi-ms-control:hover{border-color:var(--g-300);}
    .bi-ms-control:focus-within{border-color:var(--orange);box-shadow:var(--ring);}
    .bi-ms-chip{display:inline-flex;align-items:center;gap:.1rem;padding:.16rem .1rem .16rem .55rem;border-radius:var(--r-pill);background:var(--orange-50);color:var(--orange-600);border:1px solid var(--orange-100);font-size:.75rem;font-weight:600;line-height:1.2;}
    .bi-ms-chip-x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:0;border-radius:var(--r-pill);background:none;cursor:pointer;color:inherit;opacity:.55;font-size:.95rem;line-height:1;}
    .bi-ms-chip-x:hover{opacity:1;background:var(--orange-100);}
    /* Closed control: clean, just chips or a "Todos" placeholder. No input box
       in here — the search lives inside the open menu instead. */
    .bi-ms-ph{flex:1;min-width:0;color:var(--muted);font-size:.82rem;line-height:24px;}
    .bi-ms-menu{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);max-height:260px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-3);overflow:hidden;}
    /* The "Todos" search field at the top of the open menu — type to filter. */
    .bi-ms-search{margin:.3rem;height:32px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 .55rem;font-family:inherit;font-size:.82rem;color:var(--title);outline:none;}
    .bi-ms-search:focus{border-color:var(--orange);box-shadow:var(--ring);}
    .bi-ms-list{overflow-y:auto;overflow-x:hidden;padding:.15rem .25rem .25rem;}
    /* A clean list, not a column of checkboxes: each row is the value, hover
       tints, the chosen one is highlighted with a check on the right. The
       checkbox stays for state but is never drawn. */
    .bi-ms-opt{position:relative;display:block;padding:.4rem 1.7rem .4rem .55rem;border-radius:var(--r-sm);font-size:.82rem;color:var(--title);cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .bi-ms-opt:hover{background:var(--orange-50);}
    .bi-ms-opt input{position:absolute;opacity:0;pointer-events:none;}
    .bi-ms-opt:has(input:checked){background:var(--orange-50);color:var(--orange-600);font-weight:600;}
    .bi-ms-opt:has(input:checked)::after{content:"✓";position:absolute;right:.6rem;top:50%;transform:translateY(-50%);color:var(--orange);font-size:.82rem;font-weight:700;}
    .bi-ms-none,.bi-ms-more{padding:.4rem .55rem;color:var(--muted);font-size:.76rem;}
    .bi-ms-more{border-top:1px solid var(--border);margin-top:.2rem;}
    .bi-filter{display:flex;flex-direction:column;gap:.22rem;}
    .bi-filter label{font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.01em;}
    .bi-filter select,.bi-filter input{height:30px;min-width:150px;max-width:230px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 .4rem;font-size:.78rem;color:var(--title);background:var(--surface);outline:none;}
    .bi-filter select[multiple]{height:auto;min-height:30px;max-height:96px;}
    .bi-filter select:focus,.bi-filter input:focus{border-color:var(--orange);box-shadow:var(--ring);}
    .bi-daterange{display:flex;gap:.3rem;}
    .bi-daterange input{min-width:130px;}
    .bi-filter-actions{display:flex;gap:.35rem;margin-left:auto;}
    .bi-kind-warn{background:#FFF3E8;color:#9A4B00;}
    .bi-fldrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.35rem 0;border-bottom:1px solid #F1F2F4;font-size:.78rem;}
    .bi-filteredit{border-bottom:1px solid #F1F2F4;padding:.3rem 0;}
    .bi-filteredit>summary{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;cursor:pointer;font-size:.78rem;padding:.25rem 0;}
    .bi-filterform{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-top:.6rem;}
    .bi-filterform .bi-fldinput{min-width:150px;flex:1 1 150px;}

    /* ── dashboard tabs + text tiles ── */
    .bi-dash-tabs{margin:.2rem 0 1rem;flex-wrap:wrap;}
    /* A text tile is page furniture, not a card: no border, no shadow. */
    /* Scrolls rather than overlapping: the grid rows are fixed, so text that
       renders taller than its allocation has nowhere to push. Scrolling keeps
       every word reachable without disturbing the charts around it. */
    .bi-tile-text{background:none;border:none;box-shadow:none;padding:.2rem 0;position:relative;overflow:auto;}
    /* A text block is a tile like any other: on a grey page, bare text next to
       white cards reads as something that failed to render. Superset shows the
       same markdown on a white dashboard, so this is what matches it here. */
    .bi-textblock{color:var(--body);font-size:.86rem;line-height:1.5;height:100%;overflow:auto;padding:.85rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);}
    .bi-textblock>:first-child{margin-top:0;}
    .bi-textblock>:last-child{margin-bottom:0;}
    .bi-textblock h1,.bi-textblock h2,.bi-textblock h3,.bi-textblock h4{color:var(--title);margin:.5rem 0 .35rem;line-height:1.25;}
    .bi-textblock h1{font-size:1.15rem;} .bi-textblock h2{font-size:1rem;}
    .bi-textblock h3{font-size:.9rem;}   .bi-textblock h4{font-size:.84rem;}
    .bi-textblock p{margin:.35rem 0;}
    /* Tables written as raw HTML inside a Superset markdown block. */
    .bi-textblock table{border-collapse:collapse;margin:.5rem 0;font-size:.8rem;}
    .bi-textblock th,.bi-textblock td{border:1px solid var(--border);padding:.25rem .5rem;text-align:left;}
    .bi-textblock th{background:var(--g-50,#F4F5F6);font-weight:650;}
    .bi-textblock h2,.bi-textblock h3,.bi-textblock h4{color:var(--title);letter-spacing:-.01em;margin:.1rem 0 .3rem;}
    .bi-textblock h2{font-size:1.05rem;} .bi-textblock h3{font-size:.94rem;} .bi-textblock h4{font-size:.86rem;}
    .bi-textblock hr{border:none;border-top:1px solid var(--border);margin:.5rem 0;}
    .bi-textblock strong{color:var(--title);}
    .bi-textblock p{margin:.3rem 0;font-weight:400;color:var(--body);font-size:.86rem;}
    .bi-tile-text .bi-tile-ctl{position:absolute;top:0;right:0;opacity:0;transition:opacity .12s;}
    .bi-tile-text:hover .bi-tile-ctl{opacity:1;}

    /* ── table and big-number tiles ── */
    /* Scrolls inside the tile: a 200-row table must not set the row height for
       every other tile beside it. */
    .bi-tile-table{overflow:auto;max-height:320px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);}
    .bi-tile-table .bi-restbl{font-size:.74rem;}
    .bi-tile-table .bi-restbl th{font-size:.67rem;padding:.4rem .55rem;}
    .bi-tile-table .bi-restbl td{padding:.34rem .55rem;}
    /* The tile's height comes from Superset and can be short, so the number
       is sized against the box rather than fixed: a 2.6rem "78" simply fell
       out the bottom of a tile Superset had given four rows. */
    .bi-tile-number{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;height:100%;gap:.3rem;overflow:hidden;container-type:size;}
    .bi-kpi{font-size:2.6rem;line-height:1.05;font-weight:650;color:var(--title);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
    @supports (container-type:size){.bi-tile-number .bi-kpi{font-size:clamp(1.1rem,42cqh,2.6rem);}}
    .bi-kpi-lg{font-size:4rem;}
    .bi-kpi-cap{font-size:.78rem;color:var(--muted);}
    .bi-kpi-box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;}

    /* ── folders (grouping only — they carry no permission) ── */
    .bi-fld-ic{color:var(--muted);flex:none;}
    .bi-group-tt .bi-fld-ic{margin-right:.1rem;vertical-align:-2px;}
    /* Ungrouped is a real heading but not a name — lighter, so the eye reads
       the named folders first and the leftovers last. */
    .bi-fld-none{color:var(--muted);font-weight:500;}
    .bi-fileform{display:inline-flex;}
    .bi-fileselect{height:26px;max-width:130px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 .3rem;font-size:.72rem;color:var(--muted);background:var(--surface);cursor:pointer;outline:none;}
    .bi-fileselect:hover{border-color:var(--g-300);color:var(--title);}
    .bi-fileselect:focus{border-color:var(--orange);box-shadow:var(--ring);color:var(--title);}

    .bi-fldcard{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);padding:.85rem 1rem;margin-bottom:.7rem;}
    .bi-fldcard-hd{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
    .bi-fldcard-nm{font-weight:600;color:var(--title);}
    .bi-fldcard-ctl{margin-left:auto;display:flex;gap:.3rem;}
    .bi-fldform{display:grid;grid-template-columns:minmax(140px,1fr) minmax(180px,2fr) auto;gap:.4rem;margin-top:.6rem;}
    @media(max-width:700px){.bi-fldform{grid-template-columns:1fr;}}
    .bi-fldinput{height:30px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 .5rem;font-size:.8rem;color:var(--title);background:var(--surface);outline:none;}
    .bi-fldinput:focus{border-color:var(--orange);box-shadow:var(--ring);}

    /* ── query limit + result paging ── */
    .bi-limit{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--muted);margin-left:.2rem;}
    .bi-limit input{width:82px;height:26px;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:0 .35rem;font-family:var(--mono);font-size:.74rem;color:var(--title);background:var(--surface);outline:none;}
    .bi-limit input:focus{border-color:var(--orange);box-shadow:var(--ring);}
    /* Bounded height so a result never pushes the page to an absurd length */
    .bi-restbl-paged{max-height:60vh;}
    .bi-pager{display:flex;align-items:center;gap:.4rem;margin:0 0 .55rem;flex-wrap:wrap;}
    .bi-pager-info{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;margin:0 .4rem;}
    .bi-pager .bi-btn[disabled]{opacity:.4;cursor:default;}
    .bi-pager .bi-btn[disabled]:hover{border-color:var(--border-strong);background:var(--surface);color:var(--body);}

    .bi-tworow{display:grid;grid-template-columns:1fr 260px;gap:.9rem;align-items:end;}
    @media(max-width:760px){.bi-tworow{grid-template-columns:1fr;}}
    .bi-tworow .bi-fld,.bi-fld-wide{max-width:none;}

    /* ── admin ── */
    .bi-admintbl td{white-space:normal;vertical-align:middle;padding:.6rem .75rem;}
    .bi-admintbl .bi-nowrap{white-space:nowrap;}
    .bi-sub{font-size:.72rem;color:var(--muted);margin-top:.1rem;}
    .bi-row-off{opacity:.5;}
    .bi-rolepick{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;}
    .bi-chip-check{display:inline-flex;align-items:center;gap:.35rem;padding:.22rem .5rem;border:1px solid var(--border-strong);border-radius:var(--r-pill);font-size:.74rem;color:var(--body);cursor:pointer;background:var(--surface);}
    .bi-chip-check:hover{border-color:var(--g-300);color:var(--title);}
    .bi-chip-check input{width:13px;height:13px;accent-color:var(--orange);margin:0;}
    .bi-chip-check:has(input:checked){background:var(--orange-50);border-color:var(--orange-100);color:var(--orange-600);font-weight:600;}
    .bi-chip-missing span{text-decoration:line-through;color:var(--muted);}
    .bi-chip-any span{font-weight:700;}
    .bi-chip-check.bi-chip-any:has(input:checked){background:var(--purple-soft);border-color:#E3D3F7;color:var(--purple);}
    .bi-permsec{border-top:1px solid var(--border);padding:.55rem 0 .2rem;}
    .bi-permsec summary{display:flex;align-items:center;gap:.6rem;cursor:pointer;padding:.25rem 0;list-style:none;}
    .bi-permsec summary::-webkit-details-marker{display:none;}
    .bi-permsec summary::before{content:"▸";color:var(--g-300);font-size:.7rem;}
    .bi-permsec[open] summary::before{content:"▾";}
    .bi-permsec-tt{font-size:.82rem;font-weight:600;color:var(--title);}
    .bi-permsec .bi-dbgrid{max-height:190px;}
    .bi-permsec-actions{display:flex;align-items:center;gap:.4rem;margin-left:auto;}
    .bi-linkbtn{border:none;background:none;padding:0;font:inherit;font-size:.72rem;color:var(--orange);cursor:pointer;}
    .bi-linkbtn:hover{color:var(--orange-hover);text-decoration:underline;}

    /* user detail */
    .bi-usergrid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(340px,1.35fr);gap:1rem;align-items:start;}
    @media(max-width:960px){.bi-usergrid{grid-template-columns:1fr;}}
    .bi-usercol{display:flex;flex-direction:column;gap:1rem;}
    .bi-userlink{font-weight:700;color:var(--title);}
    .bi-userlink:hover{color:var(--orange);}
    .bi-deflist{display:grid;grid-template-columns:auto 1fr;gap:.4rem .9rem;font-size:.82rem;align-items:baseline;}
    .bi-deflist dt{color:var(--muted);white-space:nowrap;}
    .bi-deflist dd{color:var(--title);min-width:0;}
    .bi-flagrow{display:flex;align-items:center;gap:1rem;padding:.7rem 0;border-top:1px solid var(--border);font-size:.84rem;}
    .bi-flagrow:first-of-type{border-top:none;}
    .bi-flagrow form{margin-left:auto;}
    .bi-rolepill{display:inline-flex;align-items:center;height:20px;padding:0 .5rem;margin:.1rem .2rem .1rem 0;border-radius:var(--r-pill);background:var(--page);border:1px solid var(--border);font-size:.72rem;color:var(--body);font-family:var(--mono);}
    .bi-rolelist{display:flex;flex-direction:column;gap:.2rem;margin-bottom:.8rem;}
    .bi-rolerow{display:grid;grid-template-columns:auto auto auto 1fr;align-items:center;gap:.5rem;padding:.42rem .5rem;border-radius:var(--r-sm);cursor:pointer;}
    .bi-rolerow:hover{background:var(--page);}
    .bi-rolerow input{width:14px;height:14px;accent-color:var(--orange);}
    .bi-rolerow-nm{font-size:.85rem;font-weight:600;color:var(--title);}
    .bi-rolerow .bi-sub{margin-top:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .bi-rolecard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.05rem 1.1rem;box-shadow:var(--sh-1);margin-bottom:1rem;}
    .bi-rolecard-hd{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.35rem;}
    .bi-rolecard-nm{font-size:.95rem;font-weight:700;color:var(--title);letter-spacing:-.01em;}
    .bi-rolecard-ctl{margin-left:auto;display:flex;align-items:center;gap:.35rem;}
    /* Nearly 50 databases: a scrolling grid of checkboxes beats a long column */
    .bi-dbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:.3rem;max-height:250px;overflow-y:auto;padding:.6rem;border:1px solid var(--border);border-radius:var(--r);background:#FAFBFB;margin:.6rem 0 .8rem;}

    /* ── login ──
       The low-poly artwork is the same login-background.png the main app uses,
       over a navy fallback in case the image can't be fetched. */
    /* Painted on <body> as well as the wrapper: the wrapper alone leaves a strip
       of page background below the fold when the viewport is shorter than the
       document. `fixed` keeps the artwork from tiling as the card grows. */
    body:has(.bi-login){background:var(--navy) url("{{ url_for('static', path='login-background.png') }}") center/cover no-repeat fixed;}
    .bi-login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
      background:var(--navy) url("{{ url_for('static', path='login-background.png') }}") center/cover no-repeat fixed;}
    .bi-login-card{width:100%;max-width:392px;background:var(--surface);border-radius:16px;padding:2.1rem 1.95rem;box-shadow:0 28px 70px rgba(0,0,45,.4),0 2px 8px rgba(0,0,45,.16);}
    .bi-login-brand{display:flex;flex-direction:column;gap:1.15rem;margin-bottom:1.6rem;}
    .bi-login-brand .v360-logo{color:var(--purple);}
    .bi-login-eyebrow{font-size:.64rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:.5rem;}
    .bi-login-eyebrow::after{content:"";flex:1;height:1px;background:var(--border);}
    .bi-login-h{font-size:1.12rem;font-weight:700;color:var(--title);margin-bottom:.3rem;letter-spacing:-.015em;}
    .bi-login-p{font-size:.82rem;color:var(--muted);margin-bottom:1.4rem;line-height:1.55;}
    .bi-login .bi-fld{max-width:none;}
    .bi-login .bi-btn{width:100%;height:43px;margin-top:.3rem;}
    .bi-btn.sso{background:var(--navy);}
    .bi-btn.sso:hover{background:var(--navy-400);}
    .bi-login-or{display:flex;align-items:center;gap:.7rem;margin:1.2rem 0;color:var(--g-300);font-size:.66rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;}
    .bi-login-or::before,.bi-login-or::after{content:"";flex:1;height:1px;background:var(--border);}
    .bi-login-note{font-size:.72rem;color:var(--muted);line-height:1.55;margin-top:1rem;text-align:center;}

    @media (prefers-reduced-motion:reduce){
      *{transition:none!important;}
      .bi-card:hover{transform:none;}
    }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
