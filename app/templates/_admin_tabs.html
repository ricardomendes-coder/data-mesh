{# Shared sub-nav for the admin screens. Imported `with context` — url_for
   needs `request`, which a plain macro import does not carry through. #}
{% macro admin_tabs(current) -%}
<div class="bi-panel-tabs">
  <a class="bi-ptab {{ 'active' if current == 'users' else '' }}" href="{{ url_for('admin_users') }}">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5" r="2.5"/><path d="M3 13.5c0-2.5 2.24-4 5-4s5 1.5 5 4"/></svg>
    Users
  </a>
  <a class="bi-ptab {{ 'active' if current == 'roles' else '' }}" href="{{ url_for('admin_roles') }}">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h7"/></svg>
    Roles &amp; permissions
  </a>
  <a class="bi-ptab {{ 'active' if current == 'folders' else '' }}" href="{{ url_for('admin_folders') }}">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5h4l1.2 1.5H14v6.5H2z"/></svg>
    Folders
  </a>
</div>
{%- endmacro %}
